*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:1440px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:28px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:20px;margin:0 0 4px}
.summary{color:var(--muted);margin:0 0 20px}
section{margin:36px 0 0;scroll-margin-top:16px}
.caption{color:var(--muted);font-size:13.5px;margin:0 0 12px}
p{margin:10px 0}

nav.toc{border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin:0 0 8px;font-size:14px}

.metric{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}

table{border-collapse:collapse;width:100%;font-size:13.5px}

th{background:var(--subtle);font-weight:600;font-size:12.5px;white-space:nowrap}

td{min-width:120px}td:first-child{min-width:150px;word-break:break-word}

.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.success{background:var(--okbg);color:var(--ok)}.pill.warning{background:var(--warnbg);color:var(--warn)}.pill.danger{background:var(--badbg);color:var(--bad)}.pill.accent{background:var(--accbg);color:var(--acc2)}

label.ctl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input,select{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;min-height:36px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;background:var(--subtle);margin:4px 0 8px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);box-shadow:0 0 0 1px var(--border);font-weight:600}
dl.props{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:8px 16px;margin:12px 0;font-size:14px}
dl.props dt{color:var(--muted)}dl.props dd{margin:0}
.cards{border:1px solid var(--border);border-radius:var(--radius);margin:12px 0}

.cards a:last-child{border-bottom:0}.cards a:hover{background:var(--subtle);text-decoration:none}
.cards .ic{flex:0 0 28px;height:28px;border-radius:6px;background:var(--subtle);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);font-size:14px}
.cards .tt{font-weight:500}.cards .st{color:var(--muted);font-size:12.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:12px 0}
figure.thumb{margin:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--subtle)}
figure.thumb img{display:block;width:100%;height:auto}
figure.thumb figcaption{padding:8px 10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);background:var(--bg)}
figure.thumb figcaption b{color:var(--text);font-weight:500;display:block;word-break:break-all}
.state{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;min-height:120px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--border)}
td .tcell{width:180px}td .tcell img{width:180px;height:auto;display:block;border:1px solid var(--border);border-radius:4px}
td .tstate{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:12px;line-height:18px;border:1px solid var(--border);border-radius:999px;padding:0 7px;background:var(--subtle);white-space:nowrap}.chip.user{border-style:dashed}
.emp b{font-weight:500;display:block}.emp .st{display:block;font-size:12px;color:var(--muted)}
